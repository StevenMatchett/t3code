name: TUI npm packages

# Builds the `npx t3tui` tarballs on each platform and uploads them as workflow
# artifacts. It never publishes; see docs/operations/tui-npm-release.md.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platform packages the launcher depends on (comma-separated)
        default: linux-x64,linux-arm64,darwin-arm64,darwin-x64
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: win32-x64, runner: windows-2025 }
    steps:
      - name: Checkout
        if: contains(inputs.platforms, matrix.platform)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        if: contains(inputs.platforms, matrix.platform)
        uses: pnpm/action-setup@v4

      # The TUI renderer needs Node 26.4+ with FFI; the repository root pins Node 24.
      - name: Setup Node 26
        if: contains(inputs.platforms, matrix.platform)
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        if: contains(inputs.platforms, matrix.platform)
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: contains(inputs.platforms, matrix.platform)
        working-directory: apps/tui
        run: node scripts/build-npm-packages.mjs ../../tui-npm --platforms "${{ inputs.platforms }}"

      - name: Smoke test a clean npx install
        if: contains(inputs.platforms, matrix.platform) && matrix.platform != 'win32-x64'
        working-directory: apps/tui
        # Hosted runners have no user service manager, so this exercises the process fallback.
        run: node scripts/npx-smoke.mjs --tarballs ../../tui-npm --manager process

      - name: Upload tarballs
        if: contains(inputs.platforms, matrix.platform)
        uses: actions/upload-artifact@v4
        with:
          name: t3tui-${{ matrix.platform }}
          path: tui-npm/*.tgz
          if-no-files-found: error
