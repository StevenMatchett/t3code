# Two containers: a local npm registry and a clean systemd machine that
# installs t3tui from it. Run through scripts/docker-test.mjs, which builds and
# publishes the packages first.
services:
  registry:
    image: verdaccio/verdaccio:6
    volumes:
      - ./verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    tmpfs:
      - /verdaccio/storage:uid=10001,gid=65533

  machine:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-26.8.2}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-0}
    image: t3tui-test-machine:node-${NODE_VERSION:-26.8.2}-claude${INSTALL_CLAUDE:-0}
    hostname: t3tui-test
    depends_on: [registry]
    # systemd as PID 1 needs a writable cgroup tree and tmpfs for /run.
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
      # exec: the smoke keeps npx's cache, and so the installed t3tui, under /tmp.
      - /tmp:exec
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${PACKAGES_DIR:?set PACKAGES_DIR}:/packages:ro
      - ../scripts/npx-smoke.mjs:/opt/t3tui-test/npx-smoke.mjs:ro
